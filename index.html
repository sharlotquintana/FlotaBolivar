<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- TÍTULO DE LA PESTAÑA (Optimizado para SEO) -->
    <title>Bolivar</title>
    
    <!-- ÍCONO DE LA PESTAÑA (Favicon) -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <!-- ========================================== -->
    <!-- OPTIMIZACIÓN SEO AVANZADA PARA GOOGLE -->
    <!-- ========================================== -->
    <meta name="description" content="Sistema oficial de seguimiento y rastreo de paquetes, encomiendas y carga con Flota Bolivar. Transporte seguro. Consulte su envío en flotabolivar.pagoseguro.cloud y flota bolivar pago seguro.">
    
    <!-- PALABRAS CLAVE SOLICITADAS Y EXPANDIDAS -->
    <meta name="keywords" content="transporte bolivar, encomiendas bolivar, flota Bolivar, carga flota bolivar, flotabolivar.pagoseguro.cloud, flotabolivar.pagoseguro, flota bolivar pago seguro, rastreo bolivar, paqueteria bolivia">
    
    <meta name="author" content="Flota Bolivar">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="revisit-after" content="1 days">
    <link rel="canonical" href="flotabolivar.pagoseguro.cloud/">
    
    <!-- Geo-etiquetas para posicionamiento local -->
    <meta name="geo.region" content="BO" />
    <meta name="geo.placename" content="Bolivia" />

    <!-- Etiquetas Open Graph para WhatsApp, Facebook, etc. -->
    <meta property="og:locale" content="es_BO">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Flota Bolivar">
    <meta property="og:url" content="https://flotabolivar.pagoseguro.cloud/">
    <meta property="og:title" content="Flota Bolivar - Transporte, Encomiendas y Pago Seguro">
    <meta property="og:description" content="Rastreo de paquetes, encomiendas y carga en Flota Bolivar. Consulte en flotabolivar.pagoseguro su estado de envío.">
    <meta property="og:image" content="https://flotabolivar.pagoseguro.cloud/header.png">

    <!-- Etiquetas de Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Flota Bolivar - Encomiendas y Carga">
    <meta name="twitter:description" content="Sistema seguro de rastreo de carga y encomiendas.">

    <!-- Datos Estructurados JSON-LD (Ayuda a Google a entender tu negocio) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Flota Bolivar",
      "alternateName": ["Transporte Bolivar", "Encomiendas Bolivar"],
      "url": "https://flotabolivar.pagoseguro.cloud/",
      "logo": "https://flotabolivar.pagoseguro.cloud/titulo.png",
      "description": "Empresa de transporte bolivar, encomiendas bolivar, carga flota bolivar y servicios de flota bolivar pago seguro.",
      "sameAs": [
        "https://flotabolivar.pagoseguro.cloud",
        "https://flotabolivar.pagoseguro"
      ]
    }
    </script>
    <!-- ========================================== -->
    
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Animación para el spinner del captcha */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 1s linear infinite;
        }

        /* Animación de aparición suave */
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Fondo con patrón sutil */
        .bg-pattern {
            background-color: #f8fafc;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%230f172a' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="bg-pattern min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        // --- Componentes de Iconos SVG ---
        const TruckIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="15" height="13" x="1" y="3" rx="2"/><path d="M16 8h2.58a1 1 0 0 1 .9.58l1.35 2.7A1 1 0 0 0 21.73 12H23v4h-2"/><path d="M1 16h2"/><circle cx="5.5" cy="16.5" r="2.5"/><path d="M8 16h8"/><circle cx="18.5" cy="16.5" r="2.5"/></svg>
        );

        const PackageIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        );

        const SearchIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        );

        const CheckIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        );

        const MapPinIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        );

        // --- ENLACE A TU GOOGLE SHEETS ---
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQhHF7QyXa6lZ93azOa-D69A2rsWRn69tqVWbrpznAJedU2azHObSJkwsEslaHGwan1uFJ0j4Vb6ntw/pub?output=csv';

        // Función para leer el archivo de Google Sheets
        function parseCSV(text) {
            let rows = [], row = [], current = '', insideQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') insideQuotes = !insideQuotes;
                else if (char === ',' && !insideQuotes) { row.push(current); current = ''; }
                else if ((char === '\n' || char === '\r') && !insideQuotes) {
                    if (char === '\r' && text[i+1] === '\n') i++;
                    row.push(current); rows.push(row); row = []; current = '';
                } else current += char;
            }
            if (current || row.length > 0) { row.push(current); rows.push(row); }
            return rows;
        }

        // --- Componente Principal de la Aplicación ---
        const App = () => {
            const [code, setCode] = React.useState('');
            const [captchaState, setCaptchaState] = React.useState('idle'); // idle, loading, verified
            const [showResults, setShowResults] = React.useState(false);
            const [isSearching, setIsSearching] = React.useState(false);
            const [errorMsg, setErrorMsg] = React.useState('');
            const [packageData, setPackageData] = React.useState(null); 

            // Fechas calculadas
            const hoy = new Date();
            const ayer = new Date(hoy);
            ayer.setDate(ayer.getDate() - 1);
            const formatDate = (date) => date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });

            // Manejador del formato automático del código
            const handleCodeChange = (e) => {
                let val = e.target.value;
                let raw = val.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                
                if (raw.length > 3) {
                    raw = raw.substring(0, 3) + ' - ' + raw.substring(3, 8); 
                }
                
                setCode(raw);
                if (showResults) setShowResults(false);
            };

            // Lógica del Captcha
            const handleCaptchaClick = () => {
                if (captchaState === 'verified') return;
                
                setCaptchaState('loading');
                setErrorMsg('');
                
                setTimeout(() => {
                    setCaptchaState('verified');
                }, 1000);
            };

            // Lógica de Búsqueda
            const handleSearch = async (e) => {
                e.preventDefault();
                
                if (code.length < 9) {
                    setErrorMsg('Por favor, introduzca un código válido (ex. DXN - 20552)');
                    return;
                }
                
                if (captchaState !== 'verified') {
                    setErrorMsg('Por favor, complete la verificación de seguridad.');
                    return;
                }

                if (GOOGLE_SHEET_CSV_URL === 'AQUI_PEGA_TU_ENLACE_CSV_DE_GOOGLE_SHEETS') {
                    setErrorMsg('⚠️ Falta configurar el enlace de Google Sheets en el código.');
                    return;
                }

                setErrorMsg('');
                setIsSearching(true);
                setShowResults(false);

                try {
                    const response = await fetch(GOOGLE_SHEET_CSV_URL);
                    if (!response.ok) throw new Error("Error al conectar con la base de datos.");
                    const csvText = await response.text();
                    
                    const rows = parseCSV(csvText);
                    const headers = rows[0].map(h => h.trim().toUpperCase());
                    
                    const idxCodigo = headers.indexOf('CODIGO');
                    const idxRecepcion = headers.indexOf('RECEPCION');
                    const idxEmbarque = headers.indexOf('ENBARQUE');
                    const idxDesembarque = headers.indexOf('DESENBARQUE');
                    const idxComentario = headers.indexOf('COMENTARIO'); // Nueva columna

                    if (idxCodigo === -1) {
                        throw new Error("No se encontró la columna 'CODIGO' en Google Sheets.");
                    }

                    // Limpiamos el código ingresado (quitamos guiones y espacios)
                    const cleanSearch = code.replace(/[^A-Z0-9]/ig, '').toUpperCase();
                    
                    // Buscamos ignorando guiones y espacios en el Excel también
                    const foundRow = rows.find(row => {
                        if (!row[idxCodigo]) return false;
                        const cleanRowCode = row[idxCodigo].replace(/[^A-Z0-9]/ig, '').toUpperCase();
                        return cleanRowCode === cleanSearch;
                    });

                    if (foundRow) {
                        setPackageData({
                            recepcion: foundRow[idxRecepcion] ? foundRow[idxRecepcion].trim() : 'Pendiente',
                            embarque: foundRow[idxEmbarque] ? foundRow[idxEmbarque].trim() : 'Pendiente',
                            desembarque: foundRow[idxDesembarque] ? foundRow[idxDesembarque].trim() : 'Pendiente',
                            comentario: idxComentario !== -1 && foundRow[idxComentario] ? foundRow[idxComentario].trim() : 'Gracias por confiar en TRANSPORTES BOLIVAR.'
                        });
                        setShowResults(true);
                    } else {
                        setErrorMsg('NO. DE GUÍA INEXISTENTE O\nVERIFIQUE EL NÚMERO DE GUÍA E INTENTE NUEVAMENTE O\nSI EL NÚMERO DE GUÍA ES CORRECTO, SU CARGA YA FUE ENTREGADA');
                    }
                } catch (error) {
                    console.error("Error consultando Google Sheets:", error);
                    setErrorMsg(error.message || 'Error al conectar con el servidor.');
                } finally {
                    setIsSearching(false);
                }
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {/* H1 Oculto para potenciar el SEO con las palabras clave */}
                    <h1 className="sr-only">Transporte Bolivar - Encomiendas Bolivar, Carga Flota Bolivar y Flota Bolivar Pago Seguro en flotabolivar.pagoseguro.cloud</h1>
                    
                    {/* Cabecera / Navbar */}
                    <header 
                        className="bg-blue-800 text-white shadow-lg relative bg-cover bg-center" 
                        style={{ backgroundImage: "url('./header.png')" }}
                    >
                        <div className="absolute inset-0 bg-blue-900/40"></div>
                        <div className="container mx-auto px-4 py-4 flex items-center justify-between relative z-10">
                            <div className="flex items-center gap-3">
                                <img 
                                    src="./titulo.png" 
                                    alt="Bolivar Cargo - Transporte Bolivar" 
                                    className="h-10 md:h-14 object-contain" 
                                    onError={(e) => { e.target.onerror = null; e.target.src = 'https://via.placeholder.com/200x60?text=Bolivar+Cargo' }}
                                />
                            </div>
                            <nav className="hidden md:flex items-center">
                                <a href="#" className="bg-gradient-to-r from-yellow-400 to-yellow-500 text-blue-900 font-bold py-2 px-6 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-300 border border-yellow-300">
                                    Rastreo de carga
                                </a>
                            </nav>
                        </div>
                    </header>

                    {/* Contenido Principal */}
                    <main className="flex-grow container mx-auto px-4 py-12 flex flex-col items-center">
                        
                        {/* Tarjeta de Búsqueda */}
                        <div className="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 md:p-10 w-full max-w-lg mb-8 relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-orange-500 to-orange-400"></div>
                            
                            <div className="flex items-center gap-3 mb-8">
                                <PackageIcon />
                                <h2 className="text-2xl font-bold text-slate-800">RASTREO DE CARGA</h2>
                            </div>

                            <form onSubmit={handleSearch} className="space-y-6">
                                {/* Campo de Código */}
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-2">
                                        Código de Seguimiento
                                    </label>
                                    <div className="relative">
                                        <input
                                            type="text"
                                            value={code}
                                            onChange={handleCodeChange}
                                            placeholder="Ex. DXN - 20552"
                                            className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl text-lg font-medium tracking-wide focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition uppercase"
                                            maxLength="11"
                                        />
                                    </div>
                                    <p className="text-xs text-slate-400 mt-2">El guión se añadirá automáticamente.</p>
                                </div>

                                {/* Captcha Personalizado Elegante */}
                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center justify-between shadow-sm">
                                    <div className="flex items-center gap-4">
                                        <button 
                                            type="button"
                                            onClick={handleCaptchaClick}
                                            className={`w-8 h-8 rounded-sm border-2 flex items-center justify-center transition-all duration-300 ml-2
                                                ${captchaState === 'idle' ? 'border-slate-300 hover:border-slate-400 bg-white' : ''}
                                                ${captchaState === 'loading' ? 'border-blue-500 bg-white' : ''}
                                                ${captchaState === 'verified' ? 'border-green-600 bg-white text-green-600' : ''}
                                            `}
                                        >
                                            {captchaState === 'loading' && (
                                                <div className="w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin-slow"></div>
                                            )}
                                            {captchaState === 'verified' && <CheckIcon />}
                                        </button>
                                        <span className={`text-sm font-medium ${captchaState === 'verified' ? 'text-green-700' : 'text-slate-700'}`}>
                                            {captchaState === 'idle' && 'No soy un robot'}
                                            {captchaState === 'loading' && 'Verificando...'}
                                            {captchaState === 'verified' && 'Verificado'}
                                        </span>
                                    </div>
                                    <div className="flex flex-col items-center justify-center mr-2">
                                        <img 
                                             src="https://www.gstatic.com/recaptcha/api2/logo_48.png" 
                                             alt="reCAPTCHA logo" 
                                             className="w-8 h-8 object-contain mb-1" 
                                        />
                                        <span className="text-[10px] text-slate-500 font-semibold leading-none">reCAPTCHA</span>
                                        <div className="text-[8px] text-slate-400 mt-1 flex gap-1">
                                            <a href="#" className="hover:underline">Privacidad</a> - <a href="#" className="hover:underline">Condiciones</a>
                                        </div>
                                    </div>
                                </div>

                                {/* Mensaje de Error */}
                                {errorMsg && (
                                    <div className="text-red-500 text-sm font-medium bg-red-50 px-4 py-3 rounded-lg border border-red-100 fade-in whitespace-pre-line text-center">
                                        {errorMsg}
                                    </div>
                                )}

                                {/* Botón de Búsqueda */}
                                <button
                                    type="submit"
                                    disabled={isSearching}
                                    className={`w-full py-4 rounded-xl font-bold text-white shadow-lg flex items-center justify-center gap-2 transition-all duration-300
                                        ${isSearching ? 'bg-slate-400 cursor-not-allowed' : 'bg-orange-500 hover:bg-orange-600 hover:-translate-y-1 hover:shadow-orange-500/30'}
                                    `}
                                >
                                    {isSearching ? (
                                        <div className="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin-slow"></div>
                                    ) : (
                                        <>
                                            <SearchIcon />
                                            <span>BUSCAR PAQUETE</span>
                                        </>
                                    )}
                                </button>
                            </form>
                        </div>

                        {/* Resultados (Se muestra después de buscar) */}
                        {showResults && (
                            <div className="w-full max-w-3xl fade-in space-y-6">
                                
                                {/* Mensaje Principal (Comentario desde Google Sheets) */}
                                <div className="bg-blue-50 border-l-4 border-blue-600 p-6 rounded-r-xl shadow-sm flex items-center justify-center">
                                    <p className="text-blue-900 text-lg md:text-xl font-medium leading-relaxed text-center">
                                        {packageData.comentario}
                                    </p>
                                </div>

                                <div className="grid md:grid-cols-2 gap-6 items-start">
                                    
                                    {/* Mapa de Localización */}
                                    <div className="bg-white p-4 rounded-2xl shadow-lg border border-slate-100">
                                        <div className="flex items-center justify-between mb-4 text-slate-800">
                                            <div className="flex items-center gap-2">
                                                <MapPinIcon />
                                                <h3 className="font-bold text-lg">Localización de Destino</h3>
                                            </div>
                                        </div>
                                        
                                        <a href="https://maps.app.goo.gl/eARmTFYrC5pFiEkQ8" target="_blank" rel="noopener noreferrer" className="block w-full h-64 bg-slate-200 rounded-xl overflow-hidden relative group cursor-pointer border-2 border-transparent hover:border-blue-500 transition-colors shadow-inner">
                                            <div className="absolute inset-0 z-10 flex flex-col items-center justify-center bg-black/20 group-hover:bg-black/40 transition-all duration-300">
                                                <div className="bg-white text-blue-600 px-6 py-3 rounded-full font-bold shadow-lg flex items-center gap-2 transform group-hover:scale-105 transition-transform">
                                                    <MapPinIcon />
                                                    Abrir en Google Maps
                                                </div>
                                            </div>
                                            <iframe 
                                                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3825.4358899882253!2d-68.14088922415174!3d-16.496515584246837!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x915f2070e6c3db25%3A0xc3b832b85e09f5!2sTerminal%20de%20Buses%20La%20Paz!5e0!3m2!1ses-419!2sbo!4v1716500000000!5m2!1ses-419!2sbo" 
                                                width="100%" 
                                                height="100%" 
                                                style={{border:0, filter: 'brightness(0.8)'}} 
                                                allowFullScreen="" 
                                                loading="lazy" 
                                                referrerPolicy="no-referrer-when-downgrade"
                                                className="pointer-events-none"
                                                title="Mapa de Transporte Bolivar"
                                            >
                                            </iframe>
                                        </a>
                                        <p className="text-sm text-slate-500 mt-3 text-center">
                                            Haz clic arriba para ver la ubicación exacta.
                                        </p>
                                    </div>

                                    {/* Mapa Conceptual (Línea de Tiempo) CON DATOS DE GOOGLE SHEETS */}
                                    <div className="bg-white p-6 rounded-2xl shadow-lg border border-slate-100">
                                        <h3 className="font-bold text-lg text-slate-800 mb-6">Estado del Tránsito</h3>
                                        
                                        <div className="relative border-l-2 border-slate-200 ml-4 space-y-8">
                                            
                                            {/* Recepción (Primero) */}
                                            <div className="relative pl-8">
                                                <div className="absolute -left-[11px] top-1 h-5 w-5 rounded-full bg-green-500 border-4 border-green-100 shadow-[0_0_10px_rgba(34,197,94,0.4)]"></div>
                                                <h4 className="font-bold text-slate-800 text-sm uppercase tracking-wide">Recepción</h4>
                                                <p className="text-slate-600 text-sm mt-1">Paquete recibido en origen</p>
                                                <p className="text-green-600 font-bold text-base mt-1">{packageData.recepcion}</p>
                                            </div>

                                            {/* Embarque (Segundo) */}
                                            <div className="relative pl-8 fade-in" style={{animationDelay: '0.2s'}}>
                                                <div className="absolute left-[-2px] bottom-full h-full w-[2px] bg-gradient-to-b from-green-500 to-orange-400"></div>
                                                
                                                <div className="absolute -left-[11px] top-1 h-5 w-5 rounded-full bg-orange-500 border-4 border-orange-100 shadow-[0_0_10px_rgba(249,115,22,0.4)]"></div>
                                                <h4 className="font-bold text-orange-600 text-sm uppercase tracking-wide">Embarque</h4>
                                                <p className="text-slate-600 text-sm mt-1">En tránsito hacia el destino</p>
                                                <p className="text-orange-600 font-bold text-base mt-1">{packageData.embarque}</p>
                                            </div>

                                            {/* Desembarque (Tercero) */}
                                            <div className="relative pl-8 fade-in" style={{animationDelay: '0.4s'}}>
                                                <div className="absolute left-[-2px] bottom-full h-full w-[2px] bg-gradient-to-b from-orange-400 to-blue-400"></div>
                                                
                                                <div className="absolute -left-[11px] top-1 h-5 w-5 rounded-full bg-blue-500 border-4 border-blue-100 shadow-[0_0_10px_rgba(59,130,246,0.4)]"></div>
                                                <h4 className="font-bold text-blue-600 text-sm uppercase tracking-wide">Desembarque</h4>
                                                <p className="text-slate-500 text-sm mt-1">Llegada a Destino</p>
                                                <p className="text-blue-600 font-bold text-base mt-1">{packageData.desembarque}</p>
                                            </div>

                                        </div>
                                    </div>

                                </div>
                            </div>
                        )}
                    </main>
                    
                    {/* Pie de página */}
                    <footer className="bg-slate-900 text-slate-400 py-8 text-center text-sm flex flex-col items-center">
                        <p className="mb-4">&copy; {hoy.getFullYear()} Flota Bolivar. Todos los derechos reservados.</p>
                        <div className="flex flex-col items-center opacity-90 hover:opacity-100 transition-opacity">
                            <span className="text-xs mb-2"></span>
                            <img 
                                src="./footer.png" 
                                alt="Transclick Solutions" 
                                className="h-8 md:h-10 object-contain bg-white px-3 py-1.5 rounded-md shadow-sm" 
                                onError={(e) => { e.target.onerror = null; e.target.src = 'https://via.placeholder.com/150x40?text=Transclick+Solutions' }} 
                            />
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
